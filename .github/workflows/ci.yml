name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-dummy
        run: docker compose config -q

      - name: Build image
        run: docker build -t myapp:ci .

      - name: Smoke test
        run: |
          docker network create citest

          docker run -d --name test-db --network citest \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_USER=appuser \
            -e POSTGRES_DB=appdb \
            postgres:16

          docker run -d --name test-app --network citest \
            -e DATABASE_URL=postgresql://appuser:test@test-db:5432/appdb \
            -p 5000:5000 myapp:ci

          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/health && break
            echo "waiting for app ($i/20)"
            sleep 2
          done

          curl -f http://localhost:5000/health
          curl -f http://localhost:5000/ready

      - name: Show logs on failure
        if: failure()
        run: docker logs test-app
